<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365日日驚喜與真相日曆 👁️</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            transition: background-color 0.5s ease;
        }

        .calendar-container {
            width: 90%;
            max-width: 450px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 3px solid #38bdf8;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
            text-align: center;
            position: relative;
            transition: border-color 0.5s ease;
        }

        .calendar-header {
            font-size: 22px;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .day-counter {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .calendar-card {
            width: 100%;
            height: 220px;
            background: #182234;
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
            transition: background 0.5s ease, border-color 0.5s ease;
        }
