<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365日日驚喜與小遊戲行事曆 🎁</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            transition: background-color 0.8s ease;
        }

        .calendar-container {
            width: 90%;
            max-width: 450px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 3px solid #38bdf8;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
            text-align: center;
            position: relative;
        }

        .calendar-header {
            font-size: 22px;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .day-counter {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .calendar-card {
            width: 100%;
            height: 220px;
            background: #182234;
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .card-emoji { font-size: 56px; margin-bottom: 10px; }
        .card-title { font-size: 18px; font-weight: bold; color: #ffd700; margin-bottom: 8px; }
        .card-text { font-size: 14px; color: #e2e8f0; line-height: 1.5; padding: 0 10px; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #38bdf8;
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(56,189,248,0.3);
        }
        .btn:active { transform: scale(0.98); background-color: #0ea5e9; }
        
        .btn-game {
            background-color: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
        }

        .btn-debug {
            width: 100%;
            background: #334155;
            color: #94a3b8;
            font-size: 12px;
            padding: 6px;
            margin-top: 10px;
        }

        /* 互動小遊戲彈窗 */
        .game-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.97);
            border-radius: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #38bdf8;
            background: #0f172a;
            color: #fff;
            text-align: center;
            font-size: 16px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="calendar-container" id="mainContainer">
        <div class="calendar-header" id="headerTitle">📅 每日驚喜行事曆</div>
        <div class="day-counter" id="dayDisplay">第 1 天 / 365 天</div>

        <!-- 每日驚喜卡片 -->
        <div class="calendar-card" id="calendarCard">
            <div class="card-emoji" id="cardEmoji">🎁</div>
            <div class="card-title" id="cardTitle">歡迎來到你的日曆</div>
            <div class="card-text" id="cardText">每天都有不同的日常驚喜與小遊戲等你來發掘！</div>
        </div>

        <div class="btn-group">
            <button class="btn" id="flipBtn">翻開今天日曆 🗓️</button>
            <button class="btn btn-game" id="openGameBtn">🎮 挑戰小遊戲</button>
        </div>
        
        <button class="btn btn-debug" id="fastForwardBtn">⚡ 快轉 +30 天</button>

        <!-- 獨立的小遊戲與解密彈窗 -->
        <div class="game-overlay hidden" id="gameOverlay">
            <div style="font-size: 40px;" id="gameIcon">🧩</div>
            <h3 style="color: #ffd700; margin: 8px 0;" id="gameTitle">趣味解謎小遊戲</h3>
            <p style="font-size: 13px; color: #cbd5e0; margin-bottom: 10px; text-align: center; padding: 0 10px;" id="gameDesc">請動動腦筋破解以下關卡！</p>
            
            <div id="gameExtraInfo" style="width: 100%; margin-bottom: 5px;"></div>

            <input type="text" id="gameInput" placeholder="請輸入你的答案...">
            <button class="btn" style="background-color: #2ed573; width: 80%; margin-top: 5px;" id="submitGameBtn">提交答案</button>
            <button class="btn" style="background-color: #ef4444; width: 80%; margin-top: 8px;" id="closeGameBtn">返回日曆</button>
        </div>
    </div>

    <script>
        let currentDay = 1;
        
        // 追蹤一生只能解一次的小遊戲進度
        let completedSecrets = {
            1: false,
            2: false,
            3: false
        };

        // 表面超日常、但細想會有點微小違和感的驚喜文案
        const normalSurprises = [
            { emoji: "📖", title: "深夜的閱讀時光", text: "你晚上 10 點的時候拿起了一本書，不知不覺看了四個小時，終於把整本書看完。你心想差不多該換一本新書了，於是走到書架前，順便看了一下窗外高掛的滿月。" },
            { emoji: "🍟", title: "午後的點心", text: "你在咖啡廳點了一杯甜甜的飲料和一盤熱騰騰的薯條。你喝了一口飲料，心裡想著這甜味真好喝，然後順手拿起旁邊的薯條沾了醬放進嘴裡。" },
            { emoji: "☕", title: "熟悉的巷口", text: "你走到常去的咖啡廳買了一杯熱拿鐵。店員笑著跟你打招呼，你也習慣性地回了微笑，但直到走出門才突然想不起來，這家店到底是什麼時候開張的。" },
            { emoji: "📝", title: "桌面上的便條紙", text: "你在桌上看到一張寫著「記得買牛奶」的便條紙。你看了看字跡，確定是自己寫的沒錯，但你明明一滴牛奶都不喝。" },
            { emoji: "🛋️", title: "客廳小憩", text: "你在沙發上靠著休息，手裡拿著遙控器轉台。畫面剛好停在一個沒有訊號的沙沙聲頻道，你看了好一陣子才想起來自己本來是要找卡通看的。" }
        ];

        // 藏在小遊戲通關後的隱藏真相碎片
        const secretLoreFragments = [
            "【碎片 #01】日曆的底層程式碼似乎記錄著不屬於你的登入紀錄，感知變數正在被複寫。",
            "【碎片 #02】你發現這些日曆事件並不是隨機生成的，而是某個漫長迴圈中固定的文字腳本。",
            "【碎片 #03】『當 365 天倒數結束時，記憶快取將會被強制格式化重啟。』——系統底層日誌",
            "【碎片 #04】你試圖關閉瀏覽器分頁，卻發現滑鼠游標在返回鍵上輕輕滑開了。",
            "【碎片 #05】主機深處傳來低鳴：『謝謝你陪我運行到這裡，另一個被困在時間裡的複製品。』"
        ];
        let loreIndex = 0;

        const dayDisplay = document.getElementById("dayDisplay");
        const cardEmoji = document.getElementById("cardEmoji");
        const cardTitle = document.getElementById("cardTitle");
        const cardText = document.getElementById("cardText");
        const flipBtn = document.getElementById("flipBtn");
        const openGameBtn = document.getElementById("openGameBtn");
        const fastForwardBtn = document.getElementById("fastForwardBtn");
        const mainContainer = document.getElementById("mainContainer");
        
        const gameOverlay = document.getElementById("gameOverlay");
        const gameIcon = document.getElementById("gameIcon");
        const gameTitle = document.getElementById("gameTitle");
        const gameDesc = document.getElementById("gameDesc");
        const gameExtraInfo = document.getElementById("gameExtraInfo");
        const gameInput = document.getElementById("gameInput");
        const submitGameBtn = document.getElementById("submitGameBtn");
        const closeGameBtn = document.getElementById("closeGameBtn");

        let activeGameType = 1;

        flipBtn.addEventListener("click", () => {
            if (currentDay >= 365) {
                showCard("💀", "【365天：系統最終格式化】", "倒數結束。記憶與感知快取已被全數清空。感謝您的配合，使用者。");
                document.body.style.backgroundColor = "#000000";
                mainContainer.style.borderColor = "#ef4444";
                return;
            }

            if (currentDay > 180 && Math.random() < 0.35) {
                showCard("👁️", `第 ${currentDay} 天：似曾相識的風景`, "今天的行程與昨天完全一模一樣。連翻動日曆的手感都毫無二致。");
            } else {
                let randomItem = normalSurprises[Math.floor(Math.random() * normalSurprises.length)];
                showCard(randomItem.emoji, `第 ${currentDay} 天 - ${randomItem.title}`, randomItem.text);
            }

            currentDay++;
            dayDisplay.innerText = `第 ${currentDay} 天 / 365 天`;
        });

        function showCard(emoji, title, text) {
            cardEmoji.innerText = emoji;
            cardTitle.innerText = title;
            cardText.innerText = text;
        }

        openGameBtn.addEventListener("click", () => {
            gameOverlay.classList.remove("hidden");
            gameInput.value = "";

            if (!completedSecrets[1]) {
                activeGameType = 1;
                gameIcon.innerText = "🧩";
                gameTitle.innerText = "小遊戲 1：網頁標記解密";
                gameDesc.innerText = "用來給網頁元素唯一識別身分的 HTML 屬性是什麼？";
                gameExtraInfo.innerHTML = `<p style='color:#38bdf8; font-size:12px;'>提示：字數很短，通常是身分證的意思</p>`;
            } else if (!completedSecrets[2]) {
                activeGameType = 2;
                gameIcon.innerText = "🔢";
                gameTitle.innerText = "小遊戲 2：記憶密碼箱";
                gameDesc.innerText = "猜一個 1 到 3 之間的解鎖數字：";
                gameExtraInfo.innerHTML = `<p style='color:#38bdf8; font-size:12px;'>提示：介於 1 和 3 之間整數</p>`;
            } else {
                activeGameType = 3;
                gameIcon.innerText = "⚡";
                gameTitle.innerText = "小遊戲 3：核心終端解鎖";
                gameDesc.innerText = "請輸入解除安全鎖定的大寫英文指令：";
                gameExtraInfo.innerHTML = `<p style='color:#38bdf8; font-size:12px;'>提示：意即「覆寫」的英文單字</p>`;
            }
        });

        submitGameBtn.addEventListener("click", () => {
            let ans = gameInput.value.trim().toLowerCase();
            let correct = false;

            if (activeGameType === 1 && ans === "id") correct = true;
            if (activeGameType === 2 && ans === "2") correct = true;
            if (activeGameType === 3 && ans === "override") correct = true;

            if (correct) {
                completedSecrets[activeGameType] = true;
                gameOverlay.classList.add("hidden");

                let lore = secretLoreFragments[loreIndex % secretLoreFragments.length];
                loreIndex++;

                showCard("🔓", "小遊戲通關成功！", `恭喜答對！\n\n【解鎖隱藏發現】：\n${lore}`);
            } else {
                alert("❌ 答案不正確，請再試一次！");
            }
        });

        closeGameBtn.addEventListener("click", () => {
            gameOverlay.classList.add("hidden");
        });

        fastForwardBtn.addEventListener("click", () => {
            currentDay += 30;
            if (currentDay > 365) currentDay = 365;
            dayDisplay.innerText = `第 ${currentDay} 天 / 365 天`;
            showCard("⏩", "時間快轉", `已成功推進至第 ${currentDay} 天。周遭的記憶碎片似乎更模糊了……`);
        });
    </script>
</body>
</html>
