<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365日日驚喜日曆 🎁</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        .calendar-container {
            width: 90%;
            max-width: 450px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 3px solid #38bdf8;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
            text-align: center;
            position: relative;
        }

        .calendar-header {
            font-size: 22px;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .day-counter {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        /* 日曆翻頁卡片區 */
        .calendar-card {
            width: 100%;
            height: 220px;
            background: #182234;
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .card-emoji { font-size: 56px; margin-bottom: 10px; }
        .card-title { font-size: 18px; font-weight: bold; color: #ffd700; margin-bottom: 8px; }
        .card-text { font-size: 14px; color: #e2e8f0; line-height: 1.5; }

        /* 按鈕風格 */
        .btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #38bdf8;
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(56,189,248,0.3);
            margin-top: 5px;
        }
        .btn:active { transform: scale(0.98); background-color: #0ea5e9; }
        .btn-debug {
            background: #334155;
            color: #94a3b8;
            font-size: 12px;
            padding: 6px;
            margin-top: 10px;
        }

        /* 互動小遊戲彈窗 */
        .game-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        input[type="text"] {
            width: 80%;
            padding: 8px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #38bdf8;
            background: #0f172a;
            color: #fff;
            text-align: center;
            font-size: 16px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">📅 每日驚喜行事曆</div>
        <div class="day-counter" id="dayDisplay">第 1 天 / 365 天</div>

        <!-- 展示卡片區 -->
        <div class="calendar-card" id="card">
            <div class="card-emoji" id="cardEmoji">🎁</div>
            <div class="card-title" id="cardTitle">點擊下方按鈕</div>
            <div class="card-text" id="cardText">翻開今天的專屬日曆驚喜吧！</div>
        </div>

        <button class="btn" id="flipBtn">翻開今天日曆 🗓️</button>
        <button class="btn btn-debug" id="fastForwardBtn">⚡ 快轉 +30 天</button>

        <!-- 隨機小遊戲視窗 (隱藏預設) -->
        <div class="game-overlay hidden" id="gameOverlay">
            <div style="font-size: 40px;" id="gameIcon">🎮</div>
            <h3 style="color: #ffd700; margin: 8px 0;" id="gameTitle">觸發小遊戲小考驗！</h3>
            <p style="font-size: 13px; color: #cbd5e0;" id="gameDesc">答對即可解鎖今天的隱藏大獎！</p>
            
            <div id="gameContent"></div>

            <input type="text" id="gameInput" placeholder="輸入答案...">
            <button class="btn" style="background-color: #2ed573;" id="submitAnswerBtn">送出答案</button>
        </div>
    </div>

    <script>
        let currentDay = 1;

        // 1. 一般日常驚喜列表
        const normalSurprises = [
            { emoji: "🥭", title: "幸運水果日", text: "今日幸運指數爆表！適合吃一碗冰涼的芒果冰！" },
            { emoji: "🍕", title: "美味熱量加持", text: "今天寫程式都不會掉 Bug，就像起司一樣順滑！" },
            { emoji: "🐱", title: "貓咪幸運星", text: "你今天會遇到一隻會朝你蹭蹭的神祕貓咪！" },
            { emoji: "🌈", title: "彩色好心情", text: "記得抬頭看看天空，說不定會有漂亮的彩雲喔。" },
            { emoji: "🚀", title: "動力滿滿", text: "靈感大爆發的一天，想做什麼遊戲都能順利完成！" }
        ];

        // 2. 特殊日期大彩蛋
        const specialEggDays = {
            100: { emoji: "💯", title: "🎉 突破100天百日慶！", text: "恭喜你已經堅持了 100 天！獲得稱號：【持之以恆的程式大師】！" },
            365: { emoji: "👑", title: "🎆 一年完美通關！", text: "太厲害了！你完成了整整 365 天的驚喜之旅！獲得終極神祕驚喜禮盒！" }
        };

        // DOM 元素
        const dayDisplay = document.getElementById("dayDisplay");
        const cardEmoji = document.getElementById("cardEmoji");
        const cardTitle = document.getElementById("cardTitle");
        const cardText = document.getElementById("cardText");
        const flipBtn = document.getElementById("flipBtn");
        const fastForwardBtn = document.getElementById("fastForwardBtn");
        const gameOverlay = document.getElementById("gameOverlay");
        const gameTitle = document.getElementById("gameTitle");
        const gameDesc = document.getElementById("gameDesc");
        const gameContent = document.getElementById("gameContent");
        const gameInput = document.getElementById("gameInput");
        const submitAnswerBtn = document.getElementById("submitAnswerBtn");

        let currentCorrectAnswer = "";

        // 翻頁邏輯
        flipBtn.addEventListener("click", () => {
            // 檢查是否有第100天/第365天的特彩蛋
            if (specialEggDays[currentDay]) {
                const egg = specialEggDays[currentDay];
                showCard(egg.emoji, egg.title, egg.text);
                nextDay();
                return;
            }

            // 30% 機率觸發隨機小遊戲，70% 機率拿到一般驚喜
            if (Math.random() < 0.4) {
                triggerRandomGame();
            } else {
                let randomItem = normalSurprises[Math.floor(Math.random() * normalSurprises.length)];
                showCard(randomItem.emoji, randomItem.title, randomItem.text);
                nextDay();
            }
        });

        // 顯示卡片內容
        function showCard(emoji, title, text) {
            cardEmoji.innerText = emoji;
            cardTitle.innerText = title;
            cardText.innerText = text;
        }

        // 天數增加
        function nextDay() {
            currentDay++;
            if (currentDay > 365) currentDay = 365;
            dayDisplay.innerText = `第 ${currentDay} 天 / 365 天`;
        }

        // ⚡ 3種隨機小遊戲庫
        function triggerRandomGame() {
            gameOverlay.classList.remove("hidden");
            gameInput.value = "";
            let gameType = Math.floor(Math.random() * 3);

            if (gameType === 0) {
                // 遊戲 1: HTML 語法小會考
                gameTitle.innerText = "🧩 HTML 語法關卡";
                gameDesc.innerText = "用來給元素唯一識別身分的屬性是什麼？";
                gameContent.innerHTML = "<p style='color:#38bdf8;'>提示：可以用 document.getElementBy... 抓取它</p>";
                currentCorrectAnswer = "id";
            } else if (gameType === 1) {
                // 遊戲 2: 終極密碼
                let secretNum = Math.floor(Math.random() * 5) + 1; // 1 ~ 5
                gameTitle.innerText = "🔢 猜數字密碼關卡";
                gameDesc.innerText = "猜一個 1 到 5 之間的幸運數字：";
                gameContent.innerHTML = "<p style='color:#38bdf8;'>猜對就能順利通關！</p>";
                currentCorrectAnswer = secretNum.toString();
            } else {
                // 遊戲 3: 快速輸入解鎖
                gameTitle.innerText = "⌨️ 指令速刻關卡";
                gameDesc.innerText = "請在下方輸入解鎖指令：UNLOCK";
                gameContent.innerHTML = "<p style='color:#38bdf8;'>（請輸入大寫 UNLOCK）</p>";
                currentCorrectAnswer = "UNLOCK";
            }
        }

        // 驗證遊戲答案
        submitAnswerBtn.addEventListener("click", () => {
            let userAns = gameInput.value.trim().toLowerCase();
            if (userAns === currentCorrectAnswer.toLowerCase()) {
                alert("🎉 恭喜答對！成功解鎖本日豪華驚喜！");
                gameOverlay.classList.add("hidden");
                showCard("🏆", "【豪華遊戲通關獎勵】", "你成功解開了今天的謎題！獲得【幸運光照 +100】與超讚能量！");
                nextDay();
            } else {
                alert("❌ 答錯囉！再試一次看看～");
            }
        });

        // 快轉按鈕
        fastForwardBtn.addEventListener("click", () => {
            currentDay += 30;
            if (currentDay > 365) currentDay = 365;
            dayDisplay.innerText = `第 ${currentDay} 天 / 365 天`;
            showCard("⏩", "時間飛逝！", `已成功快轉到第 ${currentDay} 天！`);
        });
    </script>
</body>
</html>
